name: CI

# Manual only for now, to avoid paying for CI minutes on every push.
# Run from GitHub → Actions → CI → "Run workflow", or: gh workflow run CI --ref <branch>
# To re-enable automatic runs, add back:  push: { branches: [...] }  and  pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: OpenAPI contract is committed
        run: |
          npm run openapi:write:backend
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is out of date. Run 'npm run openapi:write:backend' (and 'npm run openapi:write' for iOS) and commit."
            exit 1
          }
      - name: Tests
        run: npm test
